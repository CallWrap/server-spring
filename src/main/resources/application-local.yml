# 로컬 개발용 기본값. docker-compose.yml의 postgres/rabbitmq 서비스에 맞춰져 있다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/callwrap
    username: callwrap
    password: callwrap
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    com.callwrap: DEBUG

callwrap:
  audio-storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
  jwt:
    secret: c2FtcGxlLWxvY2FsLWRldi1qd3Qtc2VjcmV0LWtleS1hdC1sZWFzdC0zMi1ieXRlcw==
  api-key:
    # 로컬 개발용 샘플 키 — 배포 환경에서는 반드시 CALLWRAP_API_KEY_INTAKE/INTERNAL 환경변수로 덮어쓸 것.
    intake: local-dev-intake-key
    internal: local-dev-internal-key
  pipeline:
    stuck-call:
      # 로컬·시연에서만 60분. 운영 기본값(15분)은 application.yml 그대로 둔다.
      #
      # 늘리는 이유: JobDispatchService가 Job 발행 시점에 PROCESSING으로 전이시키는데,
      # 맥에서는 Celery를 --pool=solo로 돌려 콜이 1건씩 순차 처리된다. 여러 건을 한 번에
      # 접수하면 뒤 콜의 경과시간에 앞 콜들의 처리시간이 통째로 포함돼, 정상 처리 중인
      # 콜이 15분을 넘겨 FAILED로 떨어진다 (Whisper large-v3 + 3건이면 최대 20분).
      #
      # 로컬에서는 워커 터미널을 직접 보고 있어 워커가 죽으면 즉시 알 수 있으므로,
      # 스위퍼를 느슨하게 둬도 "영원히 도는 스피너" 위험이 없다. 운영은 반대라 15분을 유지한다.
      timeout-minutes: ${STUCK_CALL_TIMEOUT_MINUTES:60}
