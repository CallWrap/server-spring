# 로컬 개발용 기본값. docker-compose.yml의 postgres/rabbitmq 서비스에 맞춰져 있다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/callwrap
    username: callwrap
    password: callwrap
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    com.callwrap: DEBUG
