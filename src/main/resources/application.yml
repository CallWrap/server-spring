spring:
  application:
    name: callwrap-spring
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized

callwrap:
  jwt:
    secret: ${JWT_SECRET:please-override-this-in-env-with-a-32-byte-plus-random-secret}
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
  pipeline:
    max-retry: 2
