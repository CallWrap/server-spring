spring:
  application:
    name: callwrap-spring
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  rabbitmq: # 중복 작성되었던 spring 하위 속성을 하나로 병합
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 4

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized

callwrap:
  audio-storage:
    bucket: callwrap-audio
    presign-expiration-seconds: 600
  jwt:
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600
