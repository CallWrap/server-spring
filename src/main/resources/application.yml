spring:
  application:
    name: callwrap-spring
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  rabbitmq: # 중복 작성되었던 spring 하위 속성을 하나로 병합
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 4

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized

callwrap:
  audio-storage:
    bucket: callwrap-audio
    presign-expiration-seconds: 600
  jwt:
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600
  pipeline:
    stuck-call:
      # PROCESSING인 채로 이 시간을 넘기면 워커가 죽은 것으로 보고 FAILED로 내린다 (StuckCallSweeper).
      # 정상 처리 최대 소요보다 넉넉히 잡는다 — 짧으면 오래 걸리는 콜을 죽인다.
      timeout-minutes: ${STUCK_CALL_TIMEOUT_MINUTES:15}
      sweep-interval-ms: ${STUCK_CALL_SWEEP_INTERVAL_MS:60000}
  fastapi:
    # FAQ 배치 생성 트리거(POST /internal/faq/generate-batch)를 호출할 때만 쓴다.
    # FastAPI의 api 서비스가 host에 노출한 포트(docker-compose.yml의 "8001:8000") 기준.
    base-url: ${FASTAPI_BASE_URL:http://localhost:8001}
  counselor-health:
    # 초기 운영값. 실제 상담 데이터가 쌓이면 이 다섯 값만 조정한다.
    lookback-days: ${COUNSELOR_HEALTH_LOOKBACK_DAYS:7}
    warning-negative-score: ${COUNSELOR_HEALTH_WARNING_NEGATIVE_SCORE:0.25}
    rest-negative-score: ${COUNSELOR_HEALTH_REST_NEGATIVE_SCORE:0.45}
    warning-malicious-calls: ${COUNSELOR_HEALTH_WARNING_MALICIOUS_CALLS:2}
    rest-malicious-calls: ${COUNSELOR_HEALTH_REST_MALICIOUS_CALLS:4}
  api-key:
    # 시스템 간 호출 인증(ApiKeyAuthFilter). 사보원 콜 접수 시스템과 FastAPI 배치 생성기가
    # 각자 다른 키를 쓴다 — 최소 권한 원칙(한 쪽 키가 새도 다른 경로는 못 부른다).
    intake: ${CALLWRAP_API_KEY_INTAKE}
    internal: ${CALLWRAP_API_KEY_INTERNAL}
