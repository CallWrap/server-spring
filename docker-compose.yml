services:
  postgres:
    image: postgres:16
    container_name: callwrap-spring-postgres
    environment:
      POSTGRES_DB: callwrap
      POSTGRES_USER: callwrap
      POSTGRES_PASSWORD: callwrap
    ports:
      - "5434:5432"
    volumes:
      - callwrap_pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: callwrap-spring-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: callwrap-spring-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 콘솔 UI (http://localhost:9001)

  minio-init:
    image: minio/mc:RELEASE.2024-08-03T09-32-49Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until (mc alias set local http://minio:9000 minioadmin minioadmin) do
          echo 'MinIO 대기 중...'
          sleep 1
        done
        mc mb --ignore-existing local/callwrap-audio
        echo '버킷 준비 완료'

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: callwrap-spring-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: callwrap-spring-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  callwrap_pgdata:
