services:
  postgres:
    image: postgres:16
    container_name: callwrap-spring-postgres
    environment:
      POSTGRES_DB: callwrap
      POSTGRES_USER: callwrap
      POSTGRES_PASSWORD: callwrap
    ports:
      - "5434:5432"
    volumes:
      - callwrap_pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: callwrap-spring-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: callwrap-spring-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: callwrap-spring-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  callwrap_pgdata:


