// Java 21 toolchain을 로컬에서 못 찾으면 Gradle이 직접 받아오게 한다.
// build.gradle이 languageVersion 21로 고정돼 있는데, Gradle 8+ 부터는 이 플러그인 없이
// toolchain 자동 다운로드가 안 된다 — JDK 21이 안 깔린 머신에서 빌드가 통째로 실패했다:
//   "Cannot find a Java installation ... Toolchain download repositories have not been configured."
// 이 두 줄이면 팀원이 각자 JDK 21을 설치할 필요가 없다. 이미 21이 깔려 있으면 그걸 그대로 쓴다.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'CallWrap_Spring'
